[package]
name = "smart-file-duplicate-manager"
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Alexander Suvorov <smartlegionlab@gmail.com>"]
description = "Safe and fast duplicate file manager: multi-stage detection, dry-run, XDG trash, interactive review, reusable reports"
repository = "https://github.com/smartlegionlab/smart-file-duplicate-manager-rs"
license = "BSD-3-Clause"
readme = "README.md"
keywords = ["cli", "duplicate-files", "deduplication", "file-manager", "trash"]
categories = ["command-line-utilities", "filesystem"]
exclude = [".github/", "tests/"]

[[bin]]
name = "sfdm"
path = "src/main.rs"

[dependencies]
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true